<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>باحث الكتب</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>باحث الكتب</h1>
    </header>

    <main>
      <h2>ابحث عن كتاب</h2>

      <form id="search-form">
        <input
          type="search"
          id="search"
          placeholder="اكتب اسم كتاب أو مؤلف بالإنجليزي..."
        />
        <button type="submit" class="btn">بحث</button>
      </form>

      <select id="year-filter">
        <option value="all">كل السنوات</option>
        <option value="old">قبل 2000</option>
        <option value="mid">2000 – 2010</option>
        <option value="new">بعد 2010</option>
      </select>

      <p id="status"></p>

      <div class="books-grid" id="results"></div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
